name: Test Shared Holiday UI

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "index.html"
      - "lotte/**"
      - "costco/**"
      - "assets/holiday-app.js"
      - "assets/holiday.css"
      - "scripts/**"
      - "docs/PRIVATE_SOURCE_MIGRATION.md"
      - ".gitignore"
      - "data/costco/**"
      - "data/traders/**"
      - "fetch_costco.py"
      - "validate_costco_data.py"
      - "requirements.txt"
      - ".github/workflows/update-costco.yml"
      - ".github/workflows/test-costco.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 공통 JavaScript 문법 검사
        run: node --check assets/holiday-app.js

      - name: 공개/비공개 빌드 분리 자체 테스트
        run: python scripts/test_public_build.py

      - name: 트레이더스 보조 데이터 확인
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/traders/holiday_archive.json")
          stores = json.loads(path.read_text(encoding="utf-8"))

          if len(stores) < 20:
              raise SystemExit(
                  f"트레이더스 점포 수가 예상보다 적습니다: {len(stores)}"
              )

          missing = [
              item.get("store", item.get("id"))
              for item in stores
              if not item.get("detailUrl")
          ]

          if missing:
              raise SystemExit(
                  "트레이더스 공식 상세 URL 누락: "
                  + ", ".join(map(str, missing))
              )

          print(f"Traders supplemental data OK: {len(stores)} stores")
          PY

      - name: 코스트코 공식 API 수집 테스트
        run: python fetch_costco.py

      - name: 코스트코 공개 데이터 검증
        run: python validate_costco_data.py

      - name: 생성 데이터 확인
        run: |
          echo "===== stores.json ====="
          head -n 80 data/costco/stores.json
          echo ""
          echo "===== change_status.json ====="
          cat data/costco/change_status.json
