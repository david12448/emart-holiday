name: Update Costco Holidays

on:
  workflow_dispatch:

  schedule:
    - cron: "37 5 * * 1,4"
      timezone: "Asia/Seoul"

  push:
    branches:
      - feature/costco
    paths:
      - "fetch_costco.py"
      - "validate_costco_data.py"
      - "requirements.txt"
      - ".github/workflows/update-costco.yml"

permissions:
  contents: write

concurrency:
  group: costco-holiday-update
  cancel-in-progress: false

jobs:
  update-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 코스트코 공식 API 데이터 수집
        run: python fetch_costco.py

      - name: 생성 데이터 검증
        run: python validate_costco_data.py

      - name: 변경 파일 확인
        run: |
          git status
          echo ""
          echo "===== 코스트코 현재 데이터 ====="
          head -n 60 data/costco/stores.json
          echo ""
          echo "===== 코스트코 변경 상태 ====="
          cat data/costco/change_status.json

      - name: 변경 내용 GitHub에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/costco/stores.json             data/costco/holiday_archive.json             data/costco/latest_snapshot.json             data/costco/change_status.json

          if git diff --cached --quiet; then
            echo "변경된 코스트코 데이터가 없습니다."
          else
            git commit -m "Update Costco official holiday data"

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
