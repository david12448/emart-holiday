name: Watch Costco Official Schedule Source

on:
  workflow_dispatch:

  push:
    branches:
      - feature/costco
    paths:
      - "fetch_costco_source.py"
      - ".github/workflows/watch-costco-source.yml"

permissions:
  contents: write

jobs:
  watch-source:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 코스트코 공식 휴무일 원본 확인
        run: python fetch_costco_source.py

      - name: 변경 파일 확인
        run: |
          git status
          echo ""
          echo "===== 코스트코 공식 원본 상태 ====="
          cat data/costco/source_state.json

      - name: 원본 상태 GitHub에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/costco/source_state.json

          if git diff --cached --quiet; then
            echo "공식 원본 상태 변경이 없습니다."
          else
            git commit -m "Update Costco official schedule source state"
            git push
          fi
