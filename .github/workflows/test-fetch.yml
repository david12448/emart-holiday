name: Update Emart Holidays

on:
  workflow_dispatch:

  schedule:
    - cron: "17 5 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  update-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 이마트 휴점일 수집
        run: python fetch_emart.py

      - name: 변경 파일 확인
        run: |
          git status
          echo ""
          echo "===== holidays.json ====="
          head -n 40 holidays.json

      - name: 변경 내용 GitHub에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add holidays.json holiday_archive.json

          if git diff --cached --quiet; then
            echo "변경된 휴점일 데이터가 없습니다."
          else
            git commit -m "이마트 휴점일 자동 업데이트"
            git push
          fi
