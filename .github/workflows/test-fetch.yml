name: Update Emart Holidays

on:
  workflow_dispatch:

jobs:
  update-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 이마트 휴점일 수집
        run: python fetch_emart.py

      - name: 생성 파일 확인
        run: |
          echo "===== holidays.json ====="
          head -n 80 holidays.json

          echo ""
          echo "===== holiday_archive.json ====="
          head -n 80 holiday_archive.json
