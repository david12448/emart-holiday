name: Inspect Costco Store Finder

on:
  push:
    branches:
      - feature/costco
    paths:
      - ".github/workflows/inspect-costco-store-finder.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 코스트코 매장 찾기 원본 수집
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          url = "https://www.costco.co.kr/store-finder"

          response = requests.get(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(compatible; emart-holiday/1.0; "
                      "+https://github.com/david12448/emart-holiday)"
                  )
              },
              timeout=30,
          )
          response.raise_for_status()

          open(
              "costco_store_finder.html",
              "w",
              encoding="utf-8",
          ).write(
              response.text
          )

          soup = BeautifulSoup(
              response.text,
              "html.parser",
          )

          scripts = []
          for tag in soup.find_all("script"):
              src = tag.get("src")
              if src:
                  scripts.append(
                      urljoin(
                          url,
                          src,
                      )
                  )

          open(
              "costco_store_finder_scripts.json",
              "w",
              encoding="utf-8",
          ).write(
              json.dumps(
                  scripts,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n"
          )

          print(
              f"HTML bytes: {len(response.content)}"
          )
          print(
              f"script count: {len(scripts)}"
          )
          print(
              "\n".join(scripts)
          )
          PY

      - name: 조사 자료 업로드
        uses: actions/upload-artifact@v4
        with:
          name: costco-store-finder-diagnostic
          path: |
            costco_store_finder.html
            costco_store_finder_scripts.json
          retention-days: 1
