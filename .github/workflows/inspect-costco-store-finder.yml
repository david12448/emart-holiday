name: Inspect Costco Store Finder

on:
  push:
    branches:
      - feature/costco
    paths:
      - ".github/workflows/inspect-costco-store-finder.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 코스트코 매장 찾기 번들 조사
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          PAGE_URL = "https://www.costco.co.kr/store-finder"
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(compatible; emart-holiday/1.0; "
                  "+https://github.com/david12448/emart-holiday)"
              )
          }

          session = requests.Session()
          session.headers.update(HEADERS)

          response = session.get(
              PAGE_URL,
              timeout=30,
          )
          response.raise_for_status()

          Path("costco_store_finder.html").write_text(
              response.text,
              encoding="utf-8",
          )

          soup = BeautifulSoup(
              response.text,
              "html.parser",
          )

          base_tag = soup.find("base")
          base_href = (
              base_tag.get("href")
              if base_tag
              else "/"
          )
          asset_base = urljoin(
              PAGE_URL,
              base_href,
          )

          resources = []

          for tag in soup.find_all("script"):
              src = tag.get("src")
              if src:
                  resources.append(
                      urljoin(
                          asset_base,
                          src,
                      )
                  )

          for tag in soup.find_all("link"):
              rel = tag.get("rel") or []
              href = tag.get("href")
              if (
                  href
                  and
                  "modulepreload" in rel
              ):
                  resources.append(
                      urljoin(
                          asset_base,
                          href,
                      )
                  )

          resources = list(
              dict.fromkeys(resources)
          )

          Path(
              "costco_store_finder_resources.json"
          ).write_text(
              json.dumps(
                  {
                      "baseHref": base_href,
                      "assetBase": asset_base,
                      "resources": resources,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          main_urls = [
              url
              for url in resources
              if "/main-" in url
          ]

          if not main_urls:
              raise RuntimeError(
                  "main JS 번들을 찾지 못했습니다."
              )

          main_url = main_urls[0]
          main_response = session.get(
              main_url,
              timeout=60,
          )
          main_response.raise_for_status()

          main_text = main_response.text

          Path("costco_main.js").write_text(
              main_text,
              encoding="utf-8",
          )

          target_chunks = [
              "chunk-TPDW35KC.js",
              "chunk-7RAJ75VS.js",
              "chunk-KNSLAS22.js",
          ]

          downloaded_chunks = {}

          for chunk_name in target_chunks:
              chunk_url = urljoin(
                  asset_base,
                  chunk_name,
              )
              chunk_response = session.get(
                  chunk_url,
                  timeout=60,
              )
              chunk_response.raise_for_status()

              Path(chunk_name).write_text(
                  chunk_response.text,
                  encoding="utf-8",
              )

              downloaded_chunks[chunk_name] = {
                  "url": chunk_url,
                  "bytes": len(
                      chunk_response.content
                  ),
              }

          keywords = [
              "store-finder",
              "warehouse",
              "warehouses",
              "warehouse-locator",
              "salesLocations",
              "location",
              "latitude",
              "longitude",
              "postalCode",
              "phone",
          ]

          findings = {}

          for keyword in keywords:
              contexts = []
              start = 0

              while True:
                  index = main_text.find(
                      keyword,
                      start,
                  )

                  if index < 0:
                      break

                  left = max(
                      0,
                      index - 350,
                  )
                  right = min(
                      len(main_text),
                      index + len(keyword) + 350,
                  )

                  contexts.append(
                      main_text[left:right]
                  )

                  if len(contexts) >= 20:
                      break

                  start = index + len(keyword)

              if contexts:
                  findings[keyword] = contexts

          url_candidates = sorted(
              set(
                  re.findall(
                      r"https?://[^\"'\\\s)]+",
                      main_text,
                  )
              )
          )

          api_like_urls = [
              value
              for value in url_candidates
              if any(
                  token in value.lower()
                  for token in (
                      "api",
                      "warehouse",
                      "location",
                      "costco",
                  )
              )
          ]

          Path(
              "costco_store_finder_findings.json"
          ).write_text(
              json.dumps(
                  {
                      "pageUrl": PAGE_URL,
                      "mainUrl": main_url,
                      "mainBytes": len(
                          main_response.content
                      ),
                      "findings": findings,
                      "apiLikeUrls": api_like_urls,
                      "downloadedChunks": downloaded_chunks,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              f"base: {asset_base}"
          )
          print(
              f"resource count: {len(resources)}"
          )
          print(
              f"main: {main_url}"
          )
          print(
              f"main bytes: {len(main_response.content)}"
          )
          print(
              "keywords found: "
              + ", ".join(findings.keys())
          )
          print(
              "API-like URL count: "
              + str(len(api_like_urls))
          )
          PY

      - name: 조사 자료 업로드
        uses: actions/upload-artifact@v4
        with:
          name: costco-store-finder-diagnostic
          path: |
            costco_store_finder.html
            costco_store_finder_resources.json
            costco_store_finder_findings.json
            costco_main.js
            chunk-TPDW35KC.js
            chunk-7RAJ75VS.js
            chunk-KNSLAS22.js
          retention-days: 1
