<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>이마트 휴점일 안내</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab-button {
      border: 1px solid #ddd;
      background: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .tab-button:hover {
      background: #f0f0f0;
    }

    .tab-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .region-title {
      margin-bottom: 15px;
    }

    .region-count {
      color: #777;
      font-size: 14px;
      font-weight: normal;
    }

    .empty {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      color: #777;
    }

    .notice {
      color: #777;
      font-size: 14px;
      margin-top: 30px;
    }

    .error {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      color: #b00020;
    }

    /* 요일별 묶음 */
    .holiday-accordion {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .holiday-accordion summary {
      padding: 18px 20px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }

    .holiday-accordion summary::-webkit-details-marker {
      display: none;
    }

    .holiday-accordion summary::before {
      content: "▶";
      display: inline-block;
      margin-right: 9px;
      font-size: 13px;
    }

    .holiday-accordion[open] summary::before {
      content: "▼";
    }

    .accordion-content {
      padding: 0 20px 20px;
    }

    /* 같은 날짜별 묶음 */
    .date-group {
      padding-top: 16px;
      margin-top: 6px;
      border-top: 1px solid #eee;
    }

    .date-group:first-child {
      border-top: 0;
      padding-top: 5px;
    }

    .date-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: #555;
    }

    /* 점포 3열 */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 18px;
    }

    /* 점포 링크 */
    .store-grid-item {
      display: block;
      padding: 9px 10px;
      background: #f7f7f7;
      border-radius: 6px;

      color: #222;
      text-decoration: none;
      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .store-grid-item:hover {
      background: #e9e9e9;
      transform: translateY(-1px);
    }

    .store-grid-item:focus {
      outline: 2px solid #888;
      outline-offset: 2px;
    }

    @media (max-width: 700px) {
      .store-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      .store-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>이마트 휴점일 안내</h1>

  <div class="description">
    지역을 선택하면 해당 지역의 휴점일을 요일별로 확인할 수 있습니다.
  </div>

  <div id="tabs" class="tabs"></div>

  <div id="content">
    데이터를 불러오는 중입니다...
  </div>

  <div class="notice">
    자료 출처 : 이마트 공식 홈페이지
  </div>

</div>


<script>

/*
==================================================
반드시 수정할 부분
==================================================

아래 주소를
실제로 iframe을 넣어 놓은
본인의 티스토리 포스팅 주소로 변경하세요.

예:
https://abcdef.tistory.com/123
*/

const TISTORY_POST_URL =
  "https://eapp.emart.com/main/main.do";


/*
이마트 공식 점포 상세페이지 기본 주소

첨부해주신 기존 JS와 동일한 방식이며,
현재 공식 페이지에서도 작동하는 것을 확인했습니다.
*/
const EMART_DETAIL_BASE_URL =
  "https://eapp.emart.com/branch/view.do?id=";


const regionOrder = [
  "서울",
  "인천",
  "경기",
  "대전",
  "세종",
  "충청",
  "대구",
  "경상",
  "울산",
  "부산",
  "전라",
  "광주",
  "강원",
  "제주"
];


const weekdayNames = [
  "일요일",
  "월요일",
  "화요일",
  "수요일",
  "목요일",
  "금요일",
  "토요일"
];


let holidayData = [];
const urlParams =
  new URLSearchParams(window.location.search);

const requestedRegion =
  urlParams.get("region");

let selectedRegion =
  regionOrder.includes(requestedRegion)
    ? requestedRegion
    : "서울";


/*
화면에서는
"이마트 가든5점" → "가든5점"
처럼 표시
*/
function shortStoreName(name) {

  return name.replace(
    /^이마트\s+/,
    ""
  );

}


/*
날짜에서 요일 계산
*/
function getWeekday(dateString) {

  const parts =
    dateString.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]) - 1;

  const day =
    Number(parts[2]);

  const date =
    new Date(
      year,
      month,
      day
    );

  return weekdayNames[
    date.getDay()
  ];

}


/*
2026-09-27
↓
9월 27일(일)
*/
function formatDate(dateString) {

  const parts =
    dateString.split("-");

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);

  const weekday =
    getWeekday(dateString);

  return (
    `${month}월 ${day}일` +
    `(${weekday.charAt(0)})`
  );

}


/*
점포의 휴무일들이
모두 같은 요일이면 해당 요일 그룹으로 분류

서로 다른 요일이면
기타·변동 휴무로 분류
*/
function classifyStore(store) {

  const weekdays =
    store.holidays.map(
      date => getWeekday(date)
    );

  const uniqueWeekdays =
    [...new Set(weekdays)];

  if (
    uniqueWeekdays.length === 1
  ) {

    return uniqueWeekdays[0];

  }

  return "기타·변동 휴무";

}


/*
지역 탭 생성
*/
function createTabs() {

  const tabs =
    document.getElementById(
      "tabs"
    );

  tabs.innerHTML = "";


  regionOrder.forEach(
    region => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "tab-button";


      if (
        region ===
        selectedRegion
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        region;


      button.addEventListener(
        "click",
        () => {

          selectedRegion =
            region;

          createTabs();

          renderRegion();

        }
      );


      tabs.appendChild(
        button
      );

    }
  );

}


/*
선택 지역 화면 출력
*/
function renderRegion() {

  const content =
    document.getElementById(
      "content"
    );


  const stores =
    holidayData.filter(
      item =>
        item.region ===
        selectedRegion
    );


  content.innerHTML = `
    <h2 class="region-title">

      ${selectedRegion} 지역

      <span class="region-count">
        · ${stores.length}개 점포
      </span>

    </h2>
  `;


  if (
    stores.length === 0
  ) {

    content.innerHTML += `
      <div class="empty">
        현재 등록된 휴점일 데이터가 없습니다.
      </div>
    `;

    return;

  }


  /*
  요일별 그룹
  */
  const weekdayGroups = {};


  stores.forEach(
    store => {

      const weekday =
        classifyStore(store);


      if (
        !weekdayGroups[
          weekday
        ]
      ) {

        weekdayGroups[
          weekday
        ] = [];

      }


      weekdayGroups[
        weekday
      ].push(
        store
      );

    }
  );


  const displayOrder = [
    "일요일",
    "월요일",
    "화요일",
    "수요일",
    "목요일",
    "금요일",
    "토요일",
    "기타·변동 휴무"
  ];


  displayOrder.forEach(
    groupName => {

      const groupStores =
        weekdayGroups[
          groupName
        ];


      if (!groupStores) {
        return;
      }


      const groupTitle =
        groupName ===
        "기타·변동 휴무"
          ? groupName
          : `${groupName} 휴무`;


      /*
      같은 휴무 날짜를 가진
      점포끼리 다시 묶음
      */
      const dateGroups = {};


      groupStores.forEach(
        store => {

          const key =
            [...store.holidays]
              .sort()
              .join("|");


          if (
            !dateGroups[key]
          ) {

            dateGroups[key] = [];

          }


          dateGroups[key].push(
            store
          );

        }
      );


      /*
      모든 요일 그룹을
      처음부터 펼친 상태로 표시
      */
      let html = `
        <details
          class="holiday-accordion"
          open
        >

          <summary>
            ${groupTitle}
            · ${groupStores.length}개 점포
          </summary>

          <div class="accordion-content">
      `;


      Object.entries(
        dateGroups
      )
        .sort(
          ([a], [b]) =>
            a.localeCompare(b)
        )
        .forEach(
          ([dateKey, storesInDate]) => {

            const dates =
              dateKey
                .split("|")
                .map(
                  date =>
                    formatDate(date)
                )
                .join(" · ");


            html += `
              <div class="date-group">

                <div class="date-title">
                  ${dates}
                </div>

                <div class="store-grid">
            `;


            storesInDate
              .sort(
                (a, b) =>
                  a.store.localeCompare(
                    b.store,
                    "ko"
                  )
              )
              .forEach(
                store => {

                  const displayName =
                    shortStoreName(
                      store.store
                    );


                  /*
                  href에는 티스토리 주소를 넣습니다.

                  따라서 마우스를 올리면
                  브라우저 좌측 아래에는
                  티스토리 주소가 표시됩니다.

                  실제 클릭은 아래의
                  JavaScript에서 가로채서
                  이마트 상세페이지로 이동합니다.
                  */
                  html += `
                    <a
                      class="store-grid-item store-link"
                      href="${TISTORY_POST_URL}"
                      target="_blank"
                      rel="noopener noreferrer"
                      data-store-id="${store.id}"
                      title="${displayName} 상세정보 보기"
                    >
                      ${displayName}
                    </a>
                  `;

                }
              );


            html += `
                </div>

              </div>
            `;

          }
        );


      html += `
          </div>

        </details>
      `;


      content.innerHTML +=
        html;

    }
  );

}


/*
==================================================
점포 클릭 처리
==================================================

첨부해주신 기존 JS의

e.preventDefault()
+
window.open()

방식을 그대로 적용했습니다.

차이점:
기존에는 martIds 객체에서
점포 ID를 찾았지만,

현재는 holidays.json 안에
공식 API에서 받은 id가 있으므로
그 값을 바로 사용합니다.
*/
document.addEventListener(
  "click",
  function(event) {

    const link =
      event.target.closest(
        ".store-link"
      );


    if (!link) {
      return;
    }


    event.preventDefault();


    const storeId =
      link.dataset.storeId;


    if (!storeId) {

      console.error(
        "점포 ID가 없습니다."
      );

      return;

    }


    const officialUrl =
      EMART_DETAIL_BASE_URL
      +
      encodeURIComponent(
        storeId
      );


    window.open(
      officialUrl,
      "_blank",
      "noopener"
    );

  }
);


/*
holidays.json 읽기
*/
async function loadData() {

  try {

    const response =
      await fetch(
        "./holidays.json?time="
        +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "데이터 파일을 불러오지 못했습니다."
      );

    }


    holidayData =
      await response.json();


    createTabs();

    renderRegion();


  } catch (error) {

    document
      .getElementById(
        "content"
      )
      .innerHTML = `
        <div class="error">
          휴점일 데이터를 불러오는 중 오류가 발생했습니다.
        </div>
      `;


    console.error(
      error
    );

  }

}


loadData();

</script>

</body>
</html>
