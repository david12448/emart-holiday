<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>이마트 휴점일 안내</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab-button {
      border: 1px solid #ddd;
      background: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .tab-button:hover {
      background: #f0f0f0;
    }

    .tab-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .region-title {
      margin-bottom: 15px;
    }

    .region-count {
      color: #777;
      font-size: 14px;
      font-weight: normal;
    }

    .empty {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      color: #777;
    }

    .notice {
      color: #777;
      font-size: 14px;
      margin-top: 30px;
    }

    .error {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      color: #b00020;
    }

    /* 요일별 묶음 */
    .holiday-accordion {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .holiday-accordion summary {
      padding: 18px 20px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }

    .holiday-accordion summary::-webkit-details-marker {
      display: none;
    }

    .holiday-accordion summary::before {
      content: "▶";
      display: inline-block;
      margin-right: 9px;
      font-size: 13px;
    }

    .holiday-accordion[open] summary::before {
      content: "▼";
    }

    .accordion-content {
      padding: 0 20px 20px;
    }

    /* 같은 날짜별 묶음 */
    .date-group {
      padding-top: 16px;
      margin-top: 6px;
      border-top: 1px solid #eee;
    }

    .date-group:first-child {
      border-top: 0;
      padding-top: 5px;
    }

    .date-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: #555;
    }

    /* 점포 3열 */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 18px;
    }

    /* 점포 링크 */
    .store-grid-item {
      display: block;
      padding: 9px 10px;
      background: #f7f7f7;
      border-radius: 6px;

      color: #222;
      text-decoration: none;
      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .store-grid-item:hover {
      background: #e9e9e9;
      transform: translateY(-1px);
    }

    .store-grid-item:focus {
      outline: 2px solid #888;
      outline-offset: 2px;
    }

    /* 개별 점포 상세보기 버튼 */
.store-detail-button {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 16px 18px;

  background: #ffd800;
  border: 1px solid #e6c200;
  border-radius: 10px;

  color: #222;
  text-decoration: none;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  transition:
    background 0.15s ease,
    transform 0.15s ease,
    box-shadow 0.15s ease;
}

.store-detail-button:hover {
  background: #ffcf00;
  transform: translateY(-2px);

  box-shadow:
    0 5px 14px rgba(0, 0, 0, 0.12);
}

.store-detail-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.store-detail-sub {
  font-size: 13px;
  font-weight: normal;
  color: #555;
}

.store-detail-arrow {
  font-size: 24px;
  font-weight: bold;
}


/* =========================
   월간 휴무 달력
   ========================= */

.month-calendar {
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 22px;
}

.calendar-header {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.calendar-weekday {
  text-align: center;
  padding: 7px 2px;
  font-size: 13px;
  font-weight: bold;
  color: #666;
}

.calendar-weekday.sunday {
  color: #d33;
}

.calendar-weekday.saturday {
  color: #3567b7;
}

.calendar-day {
  min-height: 66px;
  padding: 7px 5px;
  border-radius: 8px;
  background: #f7f7f7;
  text-align: center;
  border: 1px solid transparent;
}

    /* 요일별 날짜칸 배경색 */
.calendar-day.day-sun {
  background: #fff1f1;
}

.calendar-day.day-mon {
  background: #f7f7f7;
}

.calendar-day.day-tue {
  background: #f8f6ef;
}

.calendar-day.day-wed {
  background: #f3f7f3;
}

.calendar-day.day-thu {
  background: #f2f6f8;
}

.calendar-day.day-fri {
  background: #f5f3f8;
}

.calendar-day.day-sat {
  background: #eef4ff;
}
    
/* 달력 앞뒤 빈칸 */
.calendar-empty {
  background: transparent;
  border: 0;
  padding: 0;
}

.calendar-day.closed {
  background: #fff2a8;
  border-color: #f0cf38;
}

.calendar-day.today {
  box-shadow: inset 0 0 0 2px #555;
}

.calendar-date-number {
  font-size: 14px;
  font-weight: bold;
}

.calendar-closed-count {
  display: inline-block;

  margin-top: 6px;
  padding: 3px 7px;

  background: #e7a900;
  color: #222;

  border-radius: 10px;

  font-size: 11px;
  font-weight: bold;

  line-height: 1.25;
}

.calendar-legend {
  margin-top: 12px;
  font-size: 12px;
  color: #777;
  text-align: right;
}    

.calendar-today-label {
  display: inline-block;
  margin-top: 5px;
  padding: 2px 7px;

  background: #333;
  color: white;

  border-radius: 10px;

  font-size: 10px;
  font-weight: bold;
}
    
    @media (max-width: 700px) {
      .store-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      .store-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>이마트 휴점일 안내</h1>

  <div class="description">
    지역을 선택하면 해당 지역의 휴점일을 요일별로 확인할 수 있습니다.
  </div>

  <div id="tabs" class="tabs"></div>

  <div id="content">
    데이터를 불러오는 중입니다...
  </div>

  <div class="notice">
    자료 출처 : 이마트 공식 홈페이지
  </div>

</div>


<script>

/*
==================================================
반드시 수정할 부분
==================================================

아래 주소를
실제로 iframe을 넣어 놓은
본인의 티스토리 포스팅 주소로 변경하세요.

예:
https://abcdef.tistory.com/123
*/

const TISTORY_POST_URL =
  "javascript:void(0)";


/*
이마트 공식 점포 상세페이지 기본 주소

첨부해주신 기존 JS와 동일한 방식이며,
현재 공식 페이지에서도 작동하는 것을 확인했습니다.
*/
const EMART_DETAIL_BASE_URL =
  "https://eapp.emart.com/branch/view.do?id=";


const regionOrder = [
  "서울",
  "인천",
  "경기",
  "대전",
  "세종",
  "충청",
  "대구",
  "경상",
  "울산",
  "부산",
  "전라",
  "광주",
  "강원",
  "제주"
];


const weekdayNames = [
  "일요일",
  "월요일",
  "화요일",
  "수요일",
  "목요일",
  "금요일",
  "토요일"
];


  
let holidayData = [];


/*
주소의 파라미터 읽기

예:
?region=대구
?storeId=1118
*/
const urlParams =
  new URLSearchParams(
    window.location.search
  );


/*
지역 지정
*/
const requestedRegion =
  urlParams.get("region");


/*
개별 점포 지정
*/
const requestedStoreId =
  urlParams.get("storeId");


/*
지역값이 없거나 잘못되면
기본값은 서울
*/
let selectedRegion =
  regionOrder.includes(requestedRegion)
    ? requestedRegion
    : "서울";





/*
화면에서는
"이마트 가든5점" → "가든5점"
처럼 표시
*/
function shortStoreName(name) {

  return name.replace(
    /^이마트\s+/,
    ""
  );

}


/*
날짜에서 요일 계산
*/
function getWeekday(dateString) {

  const parts =
    dateString.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]) - 1;

  const day =
    Number(parts[2]);

  const date =
    new Date(
      year,
      month,
      day
    );

  return weekdayNames[
    date.getDay()
  ];

}


/*
2026-09-27
↓
9월 27일(일)
*/
function formatDate(dateString) {

  const parts =
    dateString.split("-");

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);

  const weekday =
    getWeekday(dateString);

  return (
    `${month}월 ${day}일` +
    `(${weekday.charAt(0)})`
  );

}

/*
월간 휴무 달력 생성
*/
function buildMonthCalendar(stores) {

  const holidayCount = {};


  /*
  날짜별 휴무 점포 수 계산
  */
  stores.forEach(
    store => {

      store.holidays.forEach(
        date => {

          if (!holidayCount[date]) {
            holidayCount[date] = 0;
          }

          holidayCount[date]++;

        }
      );

    }
  );


  /*
  데이터에 있는 가장 첫 휴무일을 기준으로
  표시할 연도/월 결정
  */
  const holidayDates =
    Object.keys(holidayCount)
      .sort();


  const now =
    new Date();


  let year =
    now.getFullYear();

  let month =
    now.getMonth() + 1;


  if (holidayDates.length > 0) {

    const parts =
      holidayDates[0].split("-");

    year =
      Number(parts[0]);

    month =
      Number(parts[1]);

  }


  const firstDay =
    new Date(
      year,
      month - 1,
      1
    ).getDay();


  const daysInMonth =
    new Date(
      year,
      month,
      0
    ).getDate();


  const pad =
    number =>
      String(number)
        .padStart(2, "0");


  const todayKey =
    `${now.getFullYear()}-` +
    `${pad(now.getMonth() + 1)}-` +
    `${pad(now.getDate())}`;


  let html = `
    <div class="month-calendar">

      <div class="calendar-header">
        ${year}년 ${month}월
      </div>

      <div class="calendar-grid">

        <div class="calendar-weekday sunday">일</div>
        <div class="calendar-weekday">월</div>
        <div class="calendar-weekday">화</div>
        <div class="calendar-weekday">수</div>
        <div class="calendar-weekday">목</div>
        <div class="calendar-weekday">금</div>
        <div class="calendar-weekday saturday">토</div>
  `;


  /*
  1일 이전 빈칸
  */
  for (
    let i = 0;
    i < firstDay;
    i++
  ) {

  html += `
  <div class="calendar-day calendar-empty"></div>
`;

  }


  /*
  날짜 출력
  */
  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const dateKey =
      `${year}-` +
      `${pad(month)}-` +
      `${pad(day)}`;


    const count =
      holidayCount[dateKey] || 0;


    const isClosed =
      count > 0;


    const isToday =
      dateKey === todayKey;

    const weekdayIndex =
  new Date(
    year,
    month - 1,
    day
  ).getDay();

const weekdayClass =
  [
    "day-sun",
    "day-mon",
    "day-tue",
    "day-wed",
    "day-thu",
    "day-fri",
    "day-sat"
  ][weekdayIndex];


    const closedText =
      stores.length === 1
        ? "휴무"
        : `${count}개 점포`;


    html += `
      <div
       class="
  calendar-day
  ${weekdayClass}
  ${isClosed ? "closed" : ""}
  ${isToday ? "today" : ""}
"
      >

        <div class="calendar-date-number">
  ${day}
</div>

${
  isToday
    ? `
      <div class="calendar-today-label">
        오늘
      </div>
    `
    : ""
}

${
  isClosed
    ? `
      <div class="calendar-closed-count">
        ${closedText}
      </div>
    `
    : ""
}

      </div>
    `;

  }


  html += `
      </div>

      <div class="calendar-legend">
        노란색 날짜는 휴무일입니다.
      </div>

    </div>
  `;


  return html;

}  

/*
점포의 휴무일들이
모두 같은 요일이면 해당 요일 그룹으로 분류

서로 다른 요일이면
기타·변동 휴무로 분류
*/
function classifyStore(store) {

  const weekdays =
    store.holidays.map(
      date => getWeekday(date)
    );

  const uniqueWeekdays =
    [...new Set(weekdays)];

  if (
    uniqueWeekdays.length === 1
  ) {

    return uniqueWeekdays[0];

  }

  return "기타·변동 휴무";

}


/*
지역 탭 생성
*/
function createTabs() {

  const tabs =
    document.getElementById(
      "tabs"
    );

  tabs.innerHTML = "";


  regionOrder.forEach(
    region => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "tab-button";


      if (
        region ===
        selectedRegion
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        region;


      button.addEventListener(
        "click",
        () => {

          selectedRegion =
            region;

          createTabs();

          renderRegion();

        }
      );


      tabs.appendChild(
        button
      );

    }
  );

}


/*
개별 점포 하나만 표시
*/
function renderSingleStore(store) {

  const tabs =
    document.getElementById("tabs");

  const content =
    document.getElementById("content");

  // 개별 점포 화면에서는 지역 탭 숨기기
  tabs.style.display = "none";

  const displayName =
    shortStoreName(store.store);

  const dates =
    store.holidays
      .map(date => formatDate(date))
      .join(" · ");

content.innerHTML = `
  <h2 class="region-title">
    ${displayName}

    <span class="region-count">
      · ${store.region}
    </span>
  </h2>


  ${buildMonthCalendar([store])}


  <div class="holiday-accordion">

      <div
        class="accordion-content"
        style="padding-top:20px;"
      >

        <div class="date-title">
          이번 달 휴무일
        </div>

        <div class="store-grid-item">
          ${dates || "등록된 휴무일이 없습니다."}
        </div>

        <div style="margin-top:18px;">

       <a
  class="store-detail-button store-link"
  href="${TISTORY_POST_URL}"
  target="_blank"
  rel="noopener noreferrer"
  data-store-id="${store.id}"
  title="${displayName} 상세정보 보기"
>

  <span class="store-detail-text">

    <span>
      ${displayName} 점포 상세정보 보기
    </span>

    <span class="store-detail-sub">
      이마트 공식 점포 페이지
    </span>

  </span>

  <span class="store-detail-arrow">
    →
  </span>

</a>

        </div>

      </div>

    </div>
  `;
}


/*
선택 지역 화면 출력
*/
function renderRegion() {

  const content =
    document.getElementById(
      "content"
    );

  const stores =
    holidayData.filter(
      item =>
        item.region ===
        selectedRegion
    );


  content.innerHTML = `
    <h2 class="region-title">

      ${selectedRegion} 지역

      <span class="region-count">
        · ${stores.length}개 점포
      </span>

    </h2>
  `;

content.innerHTML +=
  buildMonthCalendar(stores);
  
  if (
    stores.length === 0
  ) {

    content.innerHTML += `
      <div class="empty">
        현재 등록된 휴점일 데이터가 없습니다.
      </div>
    `;

    return;

  }


  /*
  요일별 그룹
  */
  const weekdayGroups = {};


  stores.forEach(
    store => {

      const weekday =
        classifyStore(store);


      if (
        !weekdayGroups[
          weekday
        ]
      ) {

        weekdayGroups[
          weekday
        ] = [];

      }


      weekdayGroups[
        weekday
      ].push(
        store
      );

    }
  );


  const displayOrder = [
    "일요일",
    "월요일",
    "화요일",
    "수요일",
    "목요일",
    "금요일",
    "토요일",
    "기타·변동 휴무"
  ];


  displayOrder.forEach(
    groupName => {

      const groupStores =
        weekdayGroups[
          groupName
        ];


      if (!groupStores) {
        return;
      }


      const groupTitle =
        groupName ===
        "기타·변동 휴무"
          ? groupName
          : `${groupName} 휴무`;


      /*
      같은 휴무 날짜를 가진
      점포끼리 다시 묶음
      */
      const dateGroups = {};


      groupStores.forEach(
        store => {

          const key =
            [...store.holidays]
              .sort()
              .join("|");


          if (
            !dateGroups[key]
          ) {

            dateGroups[key] = [];

          }


          dateGroups[key].push(
            store
          );

        }
      );


      /*
      모든 요일 그룹을
      처음부터 펼친 상태로 표시
      */
      let html = `
        <details
          class="holiday-accordion"
          open
        >

          <summary>
            ${groupTitle}
            · ${groupStores.length}개 점포
          </summary>

          <div class="accordion-content">
      `;


      Object.entries(
        dateGroups
      )
        .sort(
          ([a], [b]) =>
            a.localeCompare(b)
        )
        .forEach(
          ([dateKey, storesInDate]) => {

            const dates =
              dateKey
                .split("|")
                .map(
                  date =>
                    formatDate(date)
                )
                .join(" · ");


            html += `
              <div class="date-group">

                <div class="date-title">
                  ${dates}
                </div>

                <div class="store-grid">
            `;


            storesInDate
              .sort(
                (a, b) =>
                  a.store.localeCompare(
                    b.store,
                    "ko"
                  )
              )
              .forEach(
                store => {

                  const displayName =
                    shortStoreName(
                      store.store
                    );


                  /*
                  href에는 티스토리 주소를 넣습니다.

                  따라서 마우스를 올리면
                  브라우저 좌측 아래에는
                  티스토리 주소가 표시됩니다.

                  실제 클릭은 아래의
                  JavaScript에서 가로채서
                  이마트 상세페이지로 이동합니다.
                  */
                  html += `
                    <a
                      class="store-grid-item store-link"
                      href="${TISTORY_POST_URL}"
                      target="_blank"
                      rel="noopener noreferrer"
                      data-store-id="${store.id}"
                      title="${displayName} 상세정보 보기"
                    >
                      ${displayName}
                    </a>
                  `;

                }
              );


            html += `
                </div>

              </div>
            `;

          }
        );


      html += `
          </div>

        </details>
      `;


      content.innerHTML +=
        html;

    }
  );

}


/*
==================================================
점포 클릭 처리
==================================================

첨부해주신 기존 JS의

e.preventDefault()
+
window.open()

방식을 그대로 적용했습니다.

차이점:
기존에는 martIds 객체에서
점포 ID를 찾았지만,

현재는 holidays.json 안에
공식 API에서 받은 id가 있으므로
그 값을 바로 사용합니다.
*/
document.addEventListener(
  "click",
  function(event) {

    const link =
      event.target.closest(
        ".store-link"
      );


    if (!link) {
      return;
    }


    event.preventDefault();


    const storeId =
      link.dataset.storeId;


    if (!storeId) {

      console.error(
        "점포 ID가 없습니다."
      );

      return;

    }


    const officialUrl =
      EMART_DETAIL_BASE_URL
      +
      encodeURIComponent(
        storeId
      );


    window.open(
      officialUrl,
      "_blank",
      "noopener"
    );

  }
);


/*
holidays.json 읽기
*/
async function loadData() {

  try {

    const response =
      await fetch(
        "./holidays.json?time="
        +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "데이터 파일을 불러오지 못했습니다."
      );

    }


    holidayData =
      await response.json();


/*
주소에 ?storeId= 가 있으면
해당 점포 하나만 표시
*/
if (requestedStoreId) {

  const store =
    holidayData.find(
      item =>
        String(item.id) ===
        String(requestedStoreId)
    );

  if (store) {

    renderSingleStore(store);

    return;

  }

  document
    .getElementById("tabs")
    .style.display = "none";

  document
    .getElementById("content")
    .innerHTML = `
      <div class="error">
        해당 점포를 찾을 수 없습니다.
      </div>
    `;

  return;
}


/*
storeId가 없으면
기존 지역별 화면 표시
*/
createTabs();

renderRegion();


  } catch (error) {

    document
      .getElementById(
        "content"
      )
      .innerHTML = `
        <div class="error">
          휴점일 데이터를 불러오는 중 오류가 발생했습니다.
        </div>
      `;


    console.error(
      error
    );

  }

}


loadData();

</script>
