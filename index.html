<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>이마트 휴점일 안내</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab-button {
      border: 1px solid #ddd;
      background: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .tab-button:hover {
      background: #f0f0f0;
    }

    .tab-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .region-title {
      margin-bottom: 15px;
    }

    .holiday-group {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid #e5e5e5;
    }

    .holiday-group h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .store-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .store-item:last-child {
      border-bottom: 0;
    }

    .store-name {
      font-weight: bold;
    }

    .dates {
      color: #666;
      margin-top: 4px;
      font-size: 14px;
    }

    .empty {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      color: #777;
    }

    .notice {
      color: #777;
      font-size: 14px;
      margin-top: 30px;
    }

    .error {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      color: #b00020;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>이마트 휴점일 안내</h1>

  <div class="description">
    지역을 선택하면 해당 지역의 휴점일을 요일별로 확인할 수 있습니다.
  </div>

  <div id="tabs" class="tabs"></div>

  <div id="content">
    데이터를 불러오는 중입니다...
  </div>

  <div class="notice">
    자료 출처 : 이마트 공식 홈페이지
  </div>

</div>


<script>

const regionOrder = [
  "서울",
  "인천",
  "경기",
  "대전",
  "세종",
  "충청",
  "대구",
  "경상",
  "울산",
  "부산",
  "전라",
  "광주",
  "강원",
  "제주"
];

const weekdayNames = [
  "일요일",
  "월요일",
  "화요일",
  "수요일",
  "목요일",
  "금요일",
  "토요일"
];

let holidayData = [];
let selectedRegion = "서울";


function getWeekday(dateString) {

  const parts = dateString.split("-");

  const year = Number(parts[0]);
  const month = Number(parts[1]) - 1;
  const day = Number(parts[2]);

  const date = new Date(year, month, day);

  return weekdayNames[date.getDay()];
}


function formatDate(dateString) {

  const parts = dateString.split("-");

  const month = Number(parts[1]);
  const day = Number(parts[2]);

  const weekday = getWeekday(dateString);

  return `${month}월 ${day}일(${weekday.charAt(0)})`;
}


function classifyStore(store) {

  const weekdays =
    store.holidays.map(date => getWeekday(date));

  const uniqueWeekdays =
    [...new Set(weekdays)];

  if (uniqueWeekdays.length === 1) {
    return uniqueWeekdays[0];
  }

  return "기타·변동 휴무";
}


function createTabs() {

  const tabs = document.getElementById("tabs");

  tabs.innerHTML = "";

  regionOrder.forEach(region => {

    const button = document.createElement("button");

    button.className = "tab-button";

    if (region === selectedRegion) {
      button.classList.add("active");
    }

    button.textContent = region;

    button.addEventListener("click", () => {

      selectedRegion = region;

      createTabs();
      renderRegion();

    });

    tabs.appendChild(button);

  });
}


function renderRegion() {

  const content =
    document.getElementById("content");

  const stores =
    holidayData.filter(
      item => item.region === selectedRegion
    );


  content.innerHTML =
    `<h2 class="region-title">${selectedRegion} 지역</h2>`;


  if (stores.length === 0) {

    content.innerHTML += `
      <div class="empty">
        현재 등록된 휴점일 데이터가 없습니다.
      </div>
    `;

    return;
  }


  const groups = {};


  stores.forEach(store => {

    const group =
      classifyStore(store);

    if (!groups[group]) {
      groups[group] = [];
    }

    groups[group].push(store);

  });


  const displayOrder = [
    "일요일",
    "월요일",
    "화요일",
    "수요일",
    "목요일",
    "금요일",
    "토요일",
    "기타·변동 휴무"
  ];


  displayOrder.forEach(groupName => {

    if (!groups[groupName]) {
      return;
    }


    let html = `
      <div class="holiday-group">

        <h2>${groupName} 휴무</h2>
    `;


    groups[groupName].forEach(store => {

      const dates =
        store.holidays
          .map(date => formatDate(date))
          .join(" · ");


      html += `
        <div class="store-item">

          <div class="store-name">
            ${store.store}
          </div>

          <div class="dates">
            ${dates}
          </div>

        </div>
      `;

    });


    html += `</div>`;

    content.innerHTML += html;

  });

}


async function loadData() {

  try {

    const response =
      await fetch(
        "./holidays.json?time=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error("데이터 파일을 불러오지 못했습니다.");
    }


    holidayData =
      await response.json();


    createTabs();
    renderRegion();


  } catch (error) {

    document.getElementById("content").innerHTML = `
      <div class="error">
        휴점일 데이터를 불러오는 중 오류가 발생했습니다.
      </div>
    `;

    console.error(error);

  }

}


loadData();

</script>

</body>
</html>
