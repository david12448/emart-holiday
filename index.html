<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>이마트 휴점일 안내</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab-button {
      border: 1px solid #ddd;
      background: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .tab-button:hover {
      background: #f0f0f0;
    }

    .tab-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .region-title {
      margin-bottom: 15px;
    }

    .region-count {
      color: #777;
      font-size: 14px;
      font-weight: normal;
    }

    .empty {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      color: #777;
    }

    .notice {
      color: #777;
      font-size: 14px;
      margin-top: 30px;
    }

    .error {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      color: #b00020;
    }

    /* 요일별 묶음 */
    .holiday-accordion {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .holiday-accordion summary {
      padding: 18px 20px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      list-style: none;
    }

    .holiday-accordion summary::-webkit-details-marker {
      display: none;
    }

    .holiday-accordion summary::before {
      content: "▶";
      display: inline-block;
      margin-right: 9px;
      font-size: 13px;
    }

    .holiday-accordion[open] summary::before {
      content: "▼";
    }

    .accordion-content {
      padding: 0 20px 20px;
    }

    /* 같은 날짜별 묶음 */
    .date-group {
      padding-top: 16px;
      margin-top: 6px;
      border-top: 1px solid #eee;
    }

    .date-group:first-child {
      border-top: 0;
      padding-top: 5px;
    }

    .date-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: #555;
    }

    /* 점포 3열 */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 18px;
    }

    /* 점포 링크 */
    .store-grid-item {
      display: block;
      padding: 9px 10px;
      background: #f7f7f7;
      border-radius: 6px;

      color: #222;
      text-decoration: none;
      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .store-grid-item:hover {
      background: #e9e9e9;
      transform: translateY(-1px);
    }

    .store-grid-item:focus {
      outline: 2px solid #888;
      outline-offset: 2px;
    }

    /* 개별 점포 상세보기 버튼 */
.store-detail-button {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 16px 18px;

  background: #ffd800;
  border: 1px solid #e6c200;
  border-radius: 10px;

  color: #222;
  text-decoration: none;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  transition:
    background 0.15s ease,
    transform 0.15s ease,
    box-shadow 0.15s ease;
}

.store-detail-button:hover {
  background: #ffcf00;
  transform: translateY(-2px);

  box-shadow:
    0 5px 14px rgba(0, 0, 0, 0.12);
}

.store-detail-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.store-detail-sub {
  font-size: 13px;
  font-weight: normal;
  color: #555;
}

.store-detail-arrow {
  font-size: 24px;
  font-weight: bold;
}


/* =========================
   월간 휴무 달력
   ========================= */

.month-calendar {
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 22px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;

  font-size: 20px;
  font-weight: bold;
  margin-bottom: 18px;
}

.calendar-month-title {
  min-width: 120px;
  text-align: center;
}

.calendar-nav-button {
  width: 36px;
  height: 36px;

  border: 1px solid #ddd;
  border-radius: 50%;

  background: #fff;
  color: #222;

  font-size: 24px;
  line-height: 1;
  cursor: pointer;

  transition:
    background 0.15s ease,
    transform 0.15s ease;
}

.calendar-nav-button:hover:not(:disabled) {
  background: #f2f2f2;
  transform: translateY(-1px);
}

.calendar-nav-button:disabled {
  opacity: 0.25;
  cursor: default;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.calendar-weekday {
  text-align: center;
  padding: 7px 2px;
  font-size: 13px;
  font-weight: bold;
  color: #666;
}

.calendar-weekday.sunday {
  color: #d33;
}

.calendar-weekday.saturday {
  color: #3567b7;
}

.calendar-day {
  min-height: 66px;
  padding: 7px 5px;
  border-radius: 8px;
  background: #fff;
  text-align: center;
  border: 1px solid transparent;
}

/* 달력 앞뒤 빈칸 */
.calendar-empty {
  background: transparent;
  border: 0;
  padding: 0;
}

/* 휴무일 공통 */
.calendar-day.closed {
  border-width: 1px;
  border-style: solid;
}

/* 요일별 휴무일 배경색 */
.calendar-day.closed.day-sun {
  background: #ffe3e3;
  border-color: #efa9a9;
}

.calendar-day.closed.day-mon {
  background: #fff0a6;
  border-color: #e7c63c;
}

.calendar-day.closed.day-tue {
  background: #ffe6c7;
  border-color: #e5b36d;
}

.calendar-day.closed.day-wed {
  background: #e1f3df;
  border-color: #9dce98;
}

.calendar-day.closed.day-thu {
  background: #dff1f5;
  border-color: #9bcbd4;
}

.calendar-day.closed.day-fri {
  background: #eee5f7;
  border-color: #c7abe0;
}

.calendar-day.closed.day-sat {
  background: #dfeaff;
  border-color: #9db9eb;
}

/* 지난 휴무일은 연하게 */
.calendar-day.closed.past-closed {
  opacity: 0.52;
}

.calendar-day.today {
  box-shadow: inset 0 0 0 2px #555;
}

.calendar-date-number {
  font-size: 14px;
  font-weight: bold;
}

.calendar-closed-count {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 7px;

  background: #e7a900;
  color: #222;

  border-radius: 10px;

  font-size: 11px;
  font-weight: bold;
  line-height: 1.25;
}

.calendar-today-label {
  display: inline-block;
  margin-top: 5px;
  padding: 2px 7px;

  background: #333;
  color: white;

  border-radius: 10px;

  font-size: 10px;
  font-weight: bold;
}

.calendar-legend {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;

  margin-top: 14px;

  font-size: 12px;
  color: #666;
}

.calendar-legend::before {
  content: "";

  width: 10px;
  height: 10px;

  background: #e7a900;
  border-radius: 50%;

  flex-shrink: 0;
}


/* 상단 자동 안내 */
.auto-summary {
  background: #fff;
  border: 1px solid #e5e5e5;
  border-left: 4px solid #e7a900;

  border-radius: 10px;

  padding: 13px 16px;
  margin-bottom: 14px;

  color: #444;
  font-size: 14px;
  line-height: 1.6;
}

.auto-summary strong {
  color: #222;
}


/* 이번 주 휴무 */
.week-summary {
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 12px;

  padding: 17px 18px;
  margin-bottom: 18px;
}

.week-summary-title {
  display: flex;
  align-items: center;
  gap: 7px;

  margin-bottom: 12px;

  font-size: 17px;
  font-weight: bold;
}

.week-summary-period {
  margin-left: auto;
  color: #888;
  font-size: 12px;
  font-weight: normal;
}

.week-date-block + .week-date-block {
  border-top: 1px solid #eee;
  margin-top: 13px;
  padding-top: 13px;
}

.week-date-title {
  margin-bottom: 9px;
  font-weight: bold;
  color: #555;
}

.week-store-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px 12px;
}

.week-empty {
  color: #777;
  font-size: 14px;
}

@media (max-width: 700px) {
      .store-grid,
      .week-store-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .month-calendar {
        padding: 14px;
      }

      .calendar-grid {
        gap: 4px;
      }

      .calendar-day {
        min-height: 62px;
        padding: 6px 3px;
      }
    }

    @media (max-width: 450px) {
      .store-grid,
      .week-store-grid {
        grid-template-columns: 1fr;
      }

      .calendar-header {
        gap: 10px;
      }

      .calendar-nav-button {
        width: 32px;
        height: 32px;
        font-size: 21px;
      }

      .calendar-day {
        min-height: 58px;
      }

      .calendar-closed-count {
        padding: 2px 4px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>이마트 휴점일 안내</h1>

  <div id="page-description" class="description">
    지역을 선택하면 해당 지역의 휴점일을 요일별로 확인할 수 있습니다.
  </div>

  <div id="tabs" class="tabs"></div>

  <div id="content">
    데이터를 불러오는 중입니다...
  </div>

  <div class="notice">
    자료 출처 : 이마트 공식 홈페이지
  </div>

</div>


<script>

/*
==================================================
기본 설정
==================================================
*/

const TISTORY_POST_URL =
  "javascript:void(0)";


const EMART_DETAIL_BASE_URL =
  "https://eapp.emart.com/branch/view.do?id=";


const regionOrder = [
  "서울",
  "인천",
  "경기",
  "대전",
  "세종",
  "충청",
  "대구",
  "경상",
  "울산",
  "부산",
  "전라",
  "광주",
  "강원",
  "제주"
];


const weekdayNames = [
  "일요일",
  "월요일",
  "화요일",
  "수요일",
  "목요일",
  "금요일",
  "토요일"
];


let holidayData = [];


/*
주소 파라미터
예:
?region=대구
?storeId=1118
*/
const urlParams =
  new URLSearchParams(
    window.location.search
  );


const requestedRegion =
  urlParams.get("region");


const requestedStoreId =
  urlParams.get("storeId");


let selectedRegion =
  regionOrder.includes(requestedRegion)
    ? requestedRegion
    : "서울";


/*
한국 날짜 기준
*/
function getKoreaTodayDate() {

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).formatToParts(
      new Date()
    );


  const values = {};

  parts.forEach(
    part => {

      if (
        part.type === "year" ||
        part.type === "month" ||
        part.type === "day"
      ) {

        values[part.type] =
          Number(part.value);

      }

    }
  );


  return new Date(
    values.year,
    values.month - 1,
    values.day
  );

}


const koreaToday =
  getKoreaTodayDate();


let selectedYear =
  koreaToday.getFullYear();


let selectedMonth =
  koreaToday.getMonth() + 1;


/*
==================================================
공통 함수
==================================================
*/

function pad2(number) {

  return String(number)
    .padStart(2, "0");

}


function dateToKey(date) {

  return (
    `${date.getFullYear()}-` +
    `${pad2(date.getMonth() + 1)}-` +
    `${pad2(date.getDate())}`
  );

}


function getSelectedMonthKey() {

  return (
    `${selectedYear}-` +
    `${pad2(selectedMonth)}`
  );

}


function shortStoreName(name) {

  return name.replace(
    /^이마트\s+/,
    ""
  );

}


function getWeekday(dateString) {

  const parts =
    dateString.split("-");


  const date =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );


  return weekdayNames[
    date.getDay()
  ];

}


function formatDate(dateString) {

  const parts =
    dateString.split("-");


  const month =
    Number(parts[1]);


  const day =
    Number(parts[2]);


  const weekday =
    getWeekday(dateString);


  return (
    `${month}월 ${day}일` +
    `(${weekday.charAt(0)})`
  );

}


/*
선택한 달의 휴무일만 반환
*/
function getMonthHolidays(store) {

  const prefix =
    getSelectedMonthKey() + "-";


  return (
    Array.isArray(store.holidays)
      ? store.holidays.filter(
          date =>
            date.startsWith(prefix)
        )
      : []
  );

}


/*
선택한 달에 휴무가 있는 점포만 생성
기존 점포 객체는 건드리지 않습니다.
*/
function getMonthStores(stores) {

  return stores
    .map(
      store => ({
        ...store,
        holidays:
          getMonthHolidays(store)
      })
    )
    .filter(
      store =>
        store.holidays.length > 0
    );

}


/*
holiday_archive.json에 존재하는
가장 이른 달 / 가장 늦은 달
*/
function getAvailableMonthRange() {

  const months = [];


  holidayData.forEach(
    store => {

      (store.holidays || [])
        .forEach(
          date => {

            if (
              typeof date === "string" &&
              date.length >= 7
            ) {

              months.push(
                date.slice(0, 7)
              );

            }

          }
        );

    }
  );


  const uniqueMonths =
    [...new Set(months)]
      .sort();


  if (
    uniqueMonths.length === 0
  ) {

    const currentKey =
      `${koreaToday.getFullYear()}-` +
      `${pad2(koreaToday.getMonth() + 1)}`;

    return {
      min: currentKey,
      max: currentKey
    };

  }


  return {
    min: uniqueMonths[0],
    max:
      uniqueMonths[
        uniqueMonths.length - 1
      ]
  };

}


function getShiftedMonth(step) {

  const date =
    new Date(
      selectedYear,
      selectedMonth - 1 + step,
      1
    );


  return {
    year:
      date.getFullYear(),

    month:
      date.getMonth() + 1,

    key:
      `${date.getFullYear()}-` +
      `${pad2(date.getMonth() + 1)}`
  };

}


function canMoveMonth(step) {

  const range =
    getAvailableMonthRange();


  const target =
    getShiftedMonth(step);


  return (
    target.key >= range.min &&
    target.key <= range.max
  );

}


function moveMonth(step) {

  if (
    !canMoveMonth(step)
  ) {

    return;

  }


  const target =
    getShiftedMonth(step);


  selectedYear =
    target.year;


  selectedMonth =
    target.month;


  renderCurrentView();

}


/*
==================================================
월간 달력
==================================================
*/

function buildMonthCalendar(stores) {

  const holidayCount = {};


  const prefix =
    getSelectedMonthKey() + "-";


  stores.forEach(
    store => {

      (store.holidays || [])
        .filter(
          date =>
            date.startsWith(prefix)
        )
        .forEach(
          date => {

            if (!holidayCount[date]) {
              holidayCount[date] = 0;
            }

            holidayCount[date]++;

          }
        );

    }
  );


  const firstDay =
    new Date(
      selectedYear,
      selectedMonth - 1,
      1
    ).getDay();


  const daysInMonth =
    new Date(
      selectedYear,
      selectedMonth,
      0
    ).getDate();


  const todayKey =
    dateToKey(
      koreaToday
    );


  const previousDisabled =
    !canMoveMonth(-1);


  const nextDisabled =
    !canMoveMonth(1);


  let html = `
    <div class="month-calendar">

      <div class="calendar-header">

        <button
          type="button"
          class="calendar-nav-button"
          data-month-step="-1"
          aria-label="이전 달"
          ${previousDisabled ? "disabled" : ""}
        >
          ‹
        </button>

        <div class="calendar-month-title">
          ${selectedYear}년 ${selectedMonth}월
        </div>

        <button
          type="button"
          class="calendar-nav-button"
          data-month-step="1"
          aria-label="다음 달"
          ${nextDisabled ? "disabled" : ""}
        >
          ›
        </button>

      </div>

      <div class="calendar-grid">

        <div class="calendar-weekday sunday">일</div>
        <div class="calendar-weekday">월</div>
        <div class="calendar-weekday">화</div>
        <div class="calendar-weekday">수</div>
        <div class="calendar-weekday">목</div>
        <div class="calendar-weekday">금</div>
        <div class="calendar-weekday saturday">토</div>
  `;


  for (
    let i = 0;
    i < firstDay;
    i++
  ) {

    html += `
      <div class="calendar-day calendar-empty"></div>
    `;

  }


  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const dateKey =
      `${selectedYear}-` +
      `${pad2(selectedMonth)}-` +
      `${pad2(day)}`;


    const count =
      holidayCount[dateKey] || 0;


    const isClosed =
      count > 0;


    const isToday =
      dateKey === todayKey;


    const isPast =
      dateKey < todayKey;


    const weekdayIndex =
      new Date(
        selectedYear,
        selectedMonth - 1,
        day
      ).getDay();


    const weekdayClass =
      [
        "day-sun",
        "day-mon",
        "day-tue",
        "day-wed",
        "day-thu",
        "day-fri",
        "day-sat"
      ][weekdayIndex];


    const closedText =
      stores.length === 1
        ? "휴무"
        : `${count}개 점포`;


    html += `
      <div
        class="
          calendar-day
          ${weekdayClass}
          ${isClosed ? "closed" : ""}
          ${isClosed && isPast ? "past-closed" : ""}
          ${isToday ? "today" : ""}
        "
      >

        <div class="calendar-date-number">
          ${day}
        </div>

        ${
          isToday
            ? `
              <div class="calendar-today-label">
                오늘
              </div>
            `
            : ""
        }

        ${
          isClosed
            ? `
              <div class="calendar-closed-count">
                ${closedText}
              </div>
            `
            : ""
        }

      </div>
    `;

  }


  html += `
      </div>

      <div class="calendar-legend">
        색상이 표시된 날짜는 휴무일이며,
        지난 휴무일은 연하게 표시됩니다.
      </div>

    </div>
  `;


  return html;

}


/*
==================================================
상단 자동 안내문
휴무 데이터가 바뀌면 문구도 자동으로 변경됩니다.
==================================================
*/

function buildAutoSummary(
  stores,
  label
) {

  const monthStores =
    getMonthStores(stores);


  const dates =
    [
      ...new Set(
        monthStores.flatMap(
          store =>
            store.holidays
        )
      )
    ].sort();


  let message = "";


  if (
    dates.length === 0
  ) {

    message =
      `${selectedYear}년 ${selectedMonth}월 ` +
      `${label}에 등록된 휴무일이 없습니다.`;

  } else {

    const formattedDates =
      dates
        .map(
          date =>
            formatDate(date)
        )
        .join(" · ");


    message =
      `${selectedYear}년 ${selectedMonth}월 ` +
      `${label} 휴무일은 ` +
      `${formattedDates}입니다.`;

  }


  return `
    <div class="auto-summary">
      <strong>이번 달 안내</strong><br>
      ${message}
    </div>
  `;

}


/*
==================================================
이번 주 휴무 점포
선택 화면이 현재 달일 때만 표시
==================================================
*/

function buildThisWeekSummary(
  stores
) {

  const currentYear =
    koreaToday.getFullYear();


  const currentMonth =
    koreaToday.getMonth() + 1;


  /*
  다른 달을 보고 있을 때는
  이번 주 박스를 숨깁니다.
  */
  if (
    selectedYear !== currentYear ||
    selectedMonth !== currentMonth
  ) {

    return "";

  }


  const dayOfWeek =
    koreaToday.getDay();


  const mondayOffset =
    dayOfWeek === 0
      ? -6
      : 1 - dayOfWeek;


  const weekStart =
    new Date(koreaToday);


  weekStart.setDate(
    koreaToday.getDate() +
    mondayOffset
  );


  const weekEnd =
    new Date(weekStart);


  weekEnd.setDate(
    weekStart.getDate() + 6
  );


  const startKey =
    dateToKey(weekStart);


  const endKey =
    dateToKey(weekEnd);


  const dateGroups = {};


  stores.forEach(
    store => {

      (store.holidays || [])
        .forEach(
          date => {

            if (
              date >= startKey &&
              date <= endKey
            ) {

              if (!dateGroups[date]) {
                dateGroups[date] = [];
              }

              dateGroups[date].push(
                store
              );

            }

          }
        );

    }
  );


  const entries =
    Object.entries(
      dateGroups
    ).sort(
      ([a], [b]) =>
        a.localeCompare(b)
    );


  let html = `
    <div class="week-summary">

      <div class="week-summary-title">
        📅 이번 주 휴무 점포

        <span class="week-summary-period">
          ${formatDate(startKey)}
          ~
          ${formatDate(endKey)}
        </span>
      </div>
  `;


  if (
    entries.length === 0
  ) {

    html += `
      <div class="week-empty">
        이번 주에 예정된 휴무 점포가 없습니다.
      </div>
    `;

  } else {

    entries.forEach(
      ([date, storesInDate]) => {

        const uniqueStores =
          Array.from(
            new Map(
              storesInDate.map(
                store => [
                  String(store.id),
                  store
                ]
              )
            ).values()
          )
          .sort(
            (a, b) =>
              a.store.localeCompare(
                b.store,
                "ko"
              )
          );


        html += `
          <div class="week-date-block">

            <div class="week-date-title">
              ${formatDate(date)}
              ·
              ${uniqueStores.length}개 점포
            </div>

            <div class="week-store-grid">
        `;


        uniqueStores.forEach(
          store => {

            const displayName =
              shortStoreName(
                store.store
              );


            html += `
              <a
                class="store-grid-item store-link"
                href="${TISTORY_POST_URL}"
                target="_blank"
                rel="noopener noreferrer"
                data-store-id="${store.id}"
                title="${displayName} 상세정보 보기"
              >
                ${displayName}
              </a>
            `;

          }
        );


        html += `
            </div>

          </div>
        `;

      }
    );

  }


  html += `
    </div>
  `;


  return html;

}


/*
==================================================
점포 분류
==================================================
*/

function classifyStore(store) {

  const weekdays =
    store.holidays.map(
      date =>
        getWeekday(date)
    );


  const uniqueWeekdays =
    [...new Set(weekdays)];


  if (
    uniqueWeekdays.length === 1
  ) {

    return uniqueWeekdays[0];

  }


  return "기타·변동 휴무";

}


/*
==================================================
지역 탭
==================================================
*/

function createTabs() {

  const tabs =
    document.getElementById(
      "tabs"
    );


  tabs.style.display = "flex";

  tabs.innerHTML = "";


  regionOrder.forEach(
    region => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "tab-button";


      if (
        region ===
        selectedRegion
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        region;


      button.addEventListener(
        "click",
        () => {

          selectedRegion =
            region;

          createTabs();

          renderRegion();

        }
      );


      tabs.appendChild(
        button
      );

    }
  );

}

==================================================
개별 점포 화면

/*
==================================================
지역 화면
==================================================
*/

function renderRegion() {

  const content =
    document.getElementById(
      "content"
    );


  const description =
    document.getElementById(
      "page-description"
    );


  const stores =
    holidayData.filter(
      item =>
        item.region ===
        selectedRegion
    );


  const monthStores =
    getMonthStores(
      stores
    );


  description.textContent =
    `${selectedRegion} 지역의 월별 이마트 휴무일을 ` +
    `달력과 점포 목록에서 확인할 수 있습니다.`;


  content.innerHTML = `

    <h2 class="region-title">

      ${selectedRegion} 지역

      <span class="region-count">
        · ${stores.length}개 점포
      </span>

    </h2>


    ${
      buildAutoSummary(
        stores,
        `${selectedRegion} 지역`
      )
    }


    ${
      buildThisWeekSummary(
        stores
      )
    }


    ${
      buildMonthCalendar(
        stores
      )
    }
  `;


  if (
    monthStores.length === 0
  ) {

    content.innerHTML += `
      <div class="empty">
        ${selectedYear}년 ${selectedMonth}월에
        등록된 휴점일 데이터가 없습니다.
      </div>
    `;

    return;

  }


  const weekdayGroups = {};


  monthStores.forEach(
    store => {

      const weekday =
        classifyStore(
          store
        );


      if (
        !weekdayGroups[
          weekday
        ]
      ) {

        weekdayGroups[
          weekday
        ] = [];

      }


      weekdayGroups[
        weekday
      ].push(
        store
      );

    }
  );


  const displayOrder = [
    "일요일",
    "월요일",
    "화요일",
    "수요일",
    "목요일",
    "금요일",
    "토요일",
    "기타·변동 휴무"
  ];


  displayOrder.forEach(
    groupName => {

      const groupStores =
        weekdayGroups[
          groupName
        ];


      if (!groupStores) {
        return;
      }


      const groupTitle =
        groupName ===
        "기타·변동 휴무"
          ? groupName
          : `${groupName} 휴무`;


      const dateGroups = {};


      groupStores.forEach(
        store => {

          const key =
            [...store.holidays]
              .sort()
              .join("|");


          if (
            !dateGroups[key]
          ) {

            dateGroups[key] = [];

          }


          dateGroups[key].push(
            store
          );

        }
      );


      let html = `
        <details
          class="holiday-accordion"
          open
        >

          <summary>
            ${groupTitle}
            · ${groupStores.length}개 점포
          </summary>

          <div class="accordion-content">
      `;


      Object.entries(
        dateGroups
      )
        .sort(
          ([a], [b]) =>
            a.localeCompare(b)
        )
        .forEach(
          ([dateKey, storesInDate]) => {

            const dates =
              dateKey
                .split("|")
                .map(
                  date =>
                    formatDate(date)
                )
                .join(" · ");


            html += `
              <div class="date-group">

                <div class="date-title">
                  ${dates}
                </div>

                <div class="store-grid">
            `;


            storesInDate
              .sort(
                (a, b) =>
                  a.store.localeCompare(
                    b.store,
                    "ko"
                  )
              )
              .forEach(
                store => {

                  const displayName =
                    shortStoreName(
                      store.store
                    );


                  html += `
                    <a
                      class="store-grid-item store-link"
                      href="${TISTORY_POST_URL}"
                      target="_blank"
                      rel="noopener noreferrer"
                      data-store-id="${store.id}"
                      title="${displayName} 상세정보 보기"
                    >
                      ${displayName}
                    </a>
                  `;

                }
              );


            html += `
                </div>

              </div>
            `;

          }
        );


      html += `
          </div>

        </details>
      `;


      content.innerHTML +=
        html;

    }
  );

}


/*
현재 화면 다시 그리기
달력 좌우 버튼에서 사용
*/
function renderCurrentView() {

  if (
    requestedStoreId
  ) {

    const store =
      holidayData.find(
        item =>
          String(item.id) ===
          String(requestedStoreId)
      );


    if (store) {

      renderSingleStore(
        store
      );

    }

    return;

  }


  createTabs();

  renderRegion();

}


/*
==================================================
달력 이전/다음 달 버튼
==================================================
*/

document.addEventListener(
  "click",
  function(event) {

    const button =
      event.target.closest(
        ".calendar-nav-button"
      );


    if (!button) {
      return;
    }


    event.preventDefault();


    if (button.disabled) {
      return;
    }


    const step =
      Number(
        button.dataset.monthStep
      );


    moveMonth(
      step
    );

  }
);


/*
==================================================
점포 클릭 처리
==================================================
*/

document.addEventListener(
  "click",
  function(event) {

    const link =
      event.target.closest(
        ".store-link"
      );


    if (!link) {
      return;
    }


    event.preventDefault();


    const storeId =
      link.dataset.storeId;


    if (!storeId) {

      console.error(
        "점포 ID가 없습니다."
      );

      return;

    }


    const officialUrl =
      EMART_DETAIL_BASE_URL
      +
      encodeURIComponent(
        storeId
      );


    window.open(
      officialUrl,
      "_blank",
      "noopener"
    );

  }
);


/*
==================================================
데이터 읽기

월 이동을 위해 holiday_archive.json을 우선 사용합니다.
파일이 없거나 오류가 나면 holidays.json으로 자동 대체합니다.
==================================================
*/

async function loadData() {

  try {

    const cacheKey =
      Date.now();


    const currentResponse =
      await fetch(
        "./holidays.json?time=" +
        cacheKey,
        {
          cache: "no-store"
        }
      );


    if (
      !currentResponse.ok
    ) {

      throw new Error(
        "holidays.json을 불러오지 못했습니다."
      );

    }


    const currentData =
      await currentResponse.json();


    let archiveData = null;


    try {

      const archiveResponse =
        await fetch(
          "./holiday_archive.json?time=" +
          cacheKey,
          {
            cache: "no-store"
          }
        );


      if (
        archiveResponse.ok
      ) {

        archiveData =
          await archiveResponse.json();

      }

    } catch (
      archiveError
    ) {

      console.warn(
        "holiday_archive.json을 사용할 수 없어 현재 달 데이터로 대체합니다.",
        archiveError
      );

    }


    if (
      Array.isArray(archiveData) &&
      archiveData.length > 0
    ) {

      holidayData =
        archiveData;

    } else {

      holidayData =
        currentData;

    }


    if (
      requestedStoreId
    ) {

      const store =
        holidayData.find(
          item =>
            String(item.id) ===
            String(requestedStoreId)
        );


      if (store) {

        renderSingleStore(
          store
        );

        return;

      }


      document
        .getElementById(
          "tabs"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "content"
        )
        .innerHTML = `
          <div class="error">
            해당 점포를 찾을 수 없습니다.
          </div>
        `;


      return;

    }


    createTabs();

    renderRegion();


  } catch (error) {

    document
      .getElementById(
        "content"
      )
      .innerHTML = `
        <div class="error">
          휴점일 데이터를 불러오는 중 오류가 발생했습니다.
        </div>
      `;


    console.error(
      error
    );

  }

}


loadData();

</script>
