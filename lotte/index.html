<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="롯데마트 전국 점포의 휴점일을 지역별로 확인할 수 있습니다."
  >

  <title>롯데마트 휴점일 안내</title>

  <link
    rel="stylesheet"
    href="../assets/holiday.css?v=20261007-2"
  >

</head>


<body>

  <main class="container">

    <header class="page-header">

      <h1 id="page-title">
        롯데마트 휴점일 안내
      </h1>

      <p id="page-description">
        롯데마트 지역별 휴점일을 확인할 수 있습니다.
      </p>

    </header>


    <nav
      id="tabs"
      class="tabs"
      aria-label="지역 선택"
    ></nav>


    <section
      id="content"
      class="content"
    >

      <div class="loading">
        롯데마트 휴점일 정보를 불러오는 중입니다.
      </div>

    </section>


    <footer class="page-footer">

      <div id="source-label">
        자료 출처 : 롯데마트 공식 홈페이지 · 롯데마트 도와센터
      </div>

    </footer>

  </main>


  <script>

    window.MART_CONFIG = {

      /*
      ==================================================
      브랜드 기본 정보
      ==================================================
      */

      brandName:
        "롯데마트",

      allRegionsStoreLinksUseInternalView:
        true,

      storePrefix:
        "",

      sourceLabel:
        "롯데마트 공식 홈페이지 · 롯데마트 도와센터",

      officialPageLabel:
        "롯데마트 공식 점포 페이지",


      /*
      ==================================================
      점포 데이터
      ==================================================

      비공개 retail-store-source의 롯데마트 데이터를
      공개 저장소로 배포할 위치입니다.
      */

      currentDataUrl:
        "../data/lotte/lottemart/stores.json",


      /*
      ==================================================
      월별 보관 데이터
      ==================================================

      롯데 아카이브를 별도로 만들기 전까지는
      현재 점포 데이터를 그대로 사용합니다.

      추후 월별 이력 파일을 만들면
      이 주소만 교체하면 됩니다.
      */

      archiveDataUrl:
        "../data/lotte/lottemart/stores.json",


      /*
      ==================================================
      변경 감지 정보
      ==================================================

      롯데마트 / MAXX / 토이저러스 등의 변경 결과를
      한 파일에서 관리합니다.
      */

      changeStatusUrl:
        "../data/lotte/change_status.json",


      /*
      ==================================================
      공식 점포 상세 페이지
      ==================================================

      롯데 데이터에는 점포마다 detailUrl이 들어 있으므로
      별도의 detailUrlBuilder는 사용하지 않습니다.
      */

      detailBaseUrl:
        ""

    };

  </script>


  <script src="../assets/holiday-app.js?v=20261007-4"></script>

</body>

</html>
